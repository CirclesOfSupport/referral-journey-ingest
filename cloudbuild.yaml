# Env vars, memory, and request-timeout are set in the Cloud Run CONSOLE
# (Variables & Secrets), NOT here — the auto-generated trigger does not read
# env flags from this file. See the cloud_run_service_deploy runbook.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/webhook-repo/referral-journey-ingest:$COMMIT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east1-docker.pkg.dev/$PROJECT_ID/webhook-repo/referral-journey-ingest:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - referral-journey-ingest
      - --image=us-east1-docker.pkg.dev/$PROJECT_ID/webhook-repo/referral-journey-ingest:$COMMIT_SHA
      - --region=us-east1
      - --no-allow-unauthenticated
images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/webhook-repo/referral-journey-ingest:$COMMIT_SHA
